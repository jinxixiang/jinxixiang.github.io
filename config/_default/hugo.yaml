# Configuration of Hugo
# Hugo Documentation: https://gohugo.io/getting-started/configuration/#all-configuration-settings

title: Jinxi Xiang # Website name
baseURL: 'https://jinxixiang.com/' # Website URL

defaultContentLanguage: en
languageCode: en-us
removePathAccents: true

enableGitInfo: false
enableEmoji: true
enableRobotsTXT: true
ignoreFiles: [\.ipynb$, .ipynb_checkpoints$, \.Rmd$, \.Rmarkdown$, _cache$]
disableAliases: true

# Only the homepage and the publications list are rendered.
disableKinds: [taxonomy, term, RSS]
outputs:
  home: [HTML]
  section: [HTML]

imaging:
  resampleFilter: lanczos
  quality: 80
  anchor: smart

markup:
  goldmark:
    renderer:
      unsafe: true # allow inline HTML in bio and news
