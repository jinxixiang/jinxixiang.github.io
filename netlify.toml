[build]
  command = "hugo --gc --minify -b $URL"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.152.2"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

# Cache processed images between builds.
[[plugins]]
  package = "netlify-plugin-hugo-cache-resources"

# Pages from the previous HugoBlox site.
[[redirects]]
  from = "/publication/*"
  to = "/publication/"
  status = 301

[[redirects]]
  from = "/publication-type/*"
  to = "/publication/"
  status = 301

[[redirects]]
  from = "/post/*"
  to = "/#news"
  status = 301

[[redirects]]
  from = "/talk/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/project/*"
  to = "/#research"
  status = 301

[[redirects]]
  from = "/slides/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/author/*"
  to = "/"
  status = 301
